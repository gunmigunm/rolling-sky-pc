name: build-release

on:
  push:
    branches: [main]
    paths:
      - 'launcher/launcher.cs'
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:
    inputs:
      attach_full_zip:
        description: 'true = 同时把完整包挂到 Release 附件'
        type: boolean
        default: false
      full_zip_url:
        description: '完整包直链（仅 attach_full_zip=true 时使用）'
        type: string
        default: 'https://aka.doubaocdn.com/s/aTgt4UdGkt'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1 编译启动器
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "csc not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /out:"dist\RollingSky.exe" "launcher\launcher.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
          Get-Item "dist\RollingSky.exe" | Format-List Name,Length
          (Get-FileHash "dist\RollingSky.exe" -Algorithm SHA256).Hash

      - name: 2 建 Release 并上传 exe 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "滚动的天空 PC 版 v1.0.0" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          }
          $releaseId = gh release view $env:TAG --json id -q .id
          $enc = [uri]::EscapeDataString('滚动的天空.exe')
          $uploadUrl = "https://uploads.github.com/repos/$($env:REPO)/releases/$releaseId/assets?name=$enc"
          Write-Host "POST $uploadUrl"
          $resp = & curl.exe -sS -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Content-Type: application/x-msdownload" --data-binary "@dist\RollingSky.exe" $uploadUrl
          Write-Host $resp
          if ($resp -notmatch 'already_exists' -and $resp -notmatch '"state":"uploaded"') {
            throw "asset upload unexpected response"
          }

      - name: 3 清掉名字异常的旧附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
          REPO: ${{ github.repository }}
        run: |
          $rel = gh release view $env:TAG --json assets | ConvertFrom-Json
          foreach ($a in $rel.assets) {
            if ($a.name -eq 'default.exe') {
              $restId = ($a.apiUrl -split '/')[-1]
              Write-Host "delete $($a.name) $restId"
              gh api -X DELETE "repos/$($env:REPO)/releases/assets/$restId" | Out-Null
            }
          }

      - name: 4 回写附件清单（无论成败都跑）
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          gh release view $env:TAG --json tagName,url,assets | Out-File -Encoding utf8 ASSETS.json
          gh release view $env:TAG --json assets -q '.assets[] | "\(.name)  \(.size) bytes  \(.state)"' | Out-File -Encoding utf8 ASSETS.txt
          Get-Content ASSETS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ASSETS.json ASSETS.txt
          git commit -m "record release assets"
          git push
