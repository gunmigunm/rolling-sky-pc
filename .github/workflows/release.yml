name: build-release

on:
  push:
    branches: [main]
    paths:
      - 'launcher/launcher.cs'
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1 编译启动器
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "csc not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /out:dist/RollingSky.exe launcher/launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
          Copy-Item "dist/RollingSky.exe" "dist/滚动的天空.exe" -Force
          Get-ChildItem dist | Format-Table Name,Length

      - name: 2 建 Release 并上传附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "滚动的天空 PC 版 v1.0.0" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          }
          gh release upload $env:TAG "dist/RollingSky.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          gh release view $env:TAG --json assets | Out-String | Write-Host

      - name: 3 记录附件清单（无论成败都跑）
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          gh release view $env:TAG --json tagName,url,assets | Out-File -Encoding utf8 ASSETS.json
          gh release view $env:TAG --json assets -q '.assets[] | "\(.name)  \(.size) bytes  \(.state)"' | Out-File -Encoding utf8 ASSETS.txt
          Get-Content ASSETS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ASSETS.json ASSETS.txt
          git commit -m "record release assets"
          git push
