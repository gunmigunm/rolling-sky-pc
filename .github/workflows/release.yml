name: build-release

on:
  push:
    branches: [ main ]
    paths:
      - "launcher/launcher.cs"
      - ".github/workflows/release.yml"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "csc not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /out:"dist\RollingSky.exe" "launcher\launcher.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
          Get-Item "dist\RollingSky.exe" | Format-List Name,Length

      - name: create release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Rolling Sky PC v1.0.0" --notes-file RELEASE_NOTES.md
          }
          Push-Location dist
          gh release upload $env:TAG "RollingSky.exe" --clobber
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          gh release edit $env:TAG --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "notes sync failed" }
          gh release view $env:TAG --json assets | Out-String | Write-Host

      - name: drop legacy default.exe asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
          REPO: ${{ github.repository }}
        run: |
          $rel = gh release view $env:TAG --json assets | ConvertFrom-Json
          foreach ($a in $rel.assets) {
            if ($a.name -eq 'default.exe') {
              $restId = ($a.apiUrl -split '/')[-1]
              Write-Host "deleting $($a.name) $restId"
              gh api -X DELETE "repos/$($env:REPO)/releases/assets/$restId" | Out-Null
            }
          }

      - name: record
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          gh release view $env:TAG --json tagName,url,assets | Out-File -Encoding utf8 ASSETS.json
          gh release view $env:TAG --json assets -q '.assets[] | "\(.name)  \(.size)  \(.state)"' | Out-File -Encoding utf8 ASSETS.txt
          Get-Content ASSETS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record release assets" --allow-empty
          git push
