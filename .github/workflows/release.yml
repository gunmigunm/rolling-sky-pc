name: build-release

on:
  push:
    branches: [ main ]
    paths:
      - "launcher/launcher.cs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "csc not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /out:dist/RollingSky.exe launcher/launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          Get-Item dist/RollingSky.exe | Format-List Name,Length

      - name: create release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          "=== upload attempt $((Get-Date).ToUniversalTime().ToString('o')) ===" | Out-File -Encoding utf8 UPLOAD.log
          gh release view $env:TAG *> $null
          "view exit=$LASTEXITCODE" | Out-File -Append -Encoding utf8 UPLOAD.log
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Rolling Sky PC v1.0.0" --notes-file RELEASE_NOTES.md 2>&1 | Out-File -Append -Encoding utf8 UPLOAD.log
          }
          & gh release upload $env:TAG "dist/RollingSky.exe" --clobber 2>&1 | Out-File -Append -Encoding utf8 UPLOAD.log
          "upload exit=$LASTEXITCODE" | Out-File -Append -Encoding utf8 UPLOAD.log
          & gh release view $env:TAG --json assets 2>&1 | Out-File -Append -Encoding utf8 UPLOAD.log

      - name: record assets
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          gh release view $env:TAG --json tagName,url,assets | Out-File -Encoding utf8 ASSETS.json
          gh release view $env:TAG --json assets -q '.assets[] | "\(.name)  \(.size)  \(.state)"' | Out-File -Encoding utf8 ASSETS.txt
          Get-Content ASSETS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ASSETS.json ASSETS.txt UPLOAD.log
          git commit -m "record release assets and upload log" --allow-empty
          git push
